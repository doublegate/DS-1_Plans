// SOURCE: src/hooks/useCountUp.ts
// ============================================================================
/**
 * Animated counter that eases from 0 to `target` over `duration` ms (cubic ease-out).
 * Respects `prefers-reduced-motion: reduce` by resolving immediately.
 */
const useCountUp = (target, duration = 1200) => {
    const [v, setV] = useState(target);
    useEffect(() => {
        if (typeof window !== 'undefined' && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
            setV(target);
            return;
        }
        let start = null;
        let raf = null;
        const step = (ts) => {
            if (start === null)
                start = ts;
            const p = Math.min((ts - start) / duration, 1);
            const eased = 1 - Math.pow(1 - p, 3);
            setV(target * eased);
            if (p < 1)
                raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => { if (raf !== null)
            cancelAnimationFrame(raf); };
    }, [target, duration]);
    return v;
};

// Circular progress-ring gauge.
const RadialGauge = ({ value, max = 100, label, unit = '', color = THEME.amber, size = 120, }) => {
    const pct = Math.min(value / max, 1);
    const r = size / 2 - 8;
    const circ = 2 * Math.PI * r;
    const offset = circ * (1 - pct);
    return (<div style={{ width: size }} className="flex flex-col items-center">
      <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={THEME.border} strokeWidth="4"/>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth="4" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: 'stroke-dashoffset 0.8s ease' }}/>
        <text x={size / 2} y={size / 2 + 3} textAnchor="middle" fontSize="14" fontFamily="'JetBrains Mono', monospace" fill={THEME.text} fontWeight="bold">
          {value.toFixed(0)}
          {unit}
        </text>
      </svg>
      <span className="text-[11px] tracking-widest uppercase mt-1" style={{ color: THEME.textMuted }}>
        {label}
      </span>
    </div>);
};

    const [query, setQuery] = useState('');
    const [category, setCategory] = useState('ALL');
    useEffect(() => {
        if (!open)
            return;
        const onKey = (e) => {
            if (e.key === 'Escape')
                onClose();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
    }, [open, onClose]);
    const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return GLOSSARY_ENTRIES.filter(entry => {
            if (category !== 'ALL' && entry.category !== category)
                return false;
            if (!q)
                return true;
            return (entry.term.toLowerCase().includes(q) ||
                entry.expansion.toLowerCase().includes(q) ||
                entry.detail.toLowerCase().includes(q));
        });
    }, [query, category]);
    if (!open)
        return null;
    const toneForCategory = (cat) => {
        switch (cat) {
            case 'V&V Class':
                return 'red';
            case 'Symbol':
                return 'amber';
            case 'Acronym':
                return 'cyan';
            case 'Canon Hardware':
                return 'green';

      <aside role="dialog" aria-modal="true" aria-label="Nomenclature and Verification Glossary" className="w-full max-w-xl h-full flex flex-col overflow-hidden" style={{

                    background: active ? THEME.amber : THEME.panel,

const STEFAN_BOLTZMANN = 5.670374419e-8; // W m^-2 K^-4
const HULL_AREA_M2 = 4.52389e10; // 4 * pi * (60,000 m)^2
const SHOT_ENERGY_J = 2.24e32; // Alderaan binding energy
const ReactorTab = ({ firing, startFire, onNavigate }) => {
    // Interactive Thermal & Coupling Trade-Study Calculator state
    const [logIneff, setLogIneff] = useState(-3); // log10(1 - eta), from -9 to -1
    const [hullTempK, setHullTempK] = useState(1000); // K, from 300 to 5800
    const [cycleMode, setCycleMode] = useState('DS1');
    const tradeStudy = useMemo(() => {
        const ineff = Math.pow(10, logIneff);
        const wasteHeatJ = SHOT_ENERGY_J * ineff;
        const radPowerW = STEFAN_BOLTZMANN * HULL_AREA_M2 * Math.pow(hullTempK, 4);
        const cooldownSec = wasteHeatJ / radPowerW;
        const cooldownYears = cooldownSec / (365.25 * 86400);
        const targetCycleSec = cycleMode === 'DS1' ? 86400 : 240; // 24h vs 4 min
        const requiredPowerW = wasteHeatJ / targetCycleSec;
        const areaMultiple = requiredPowerW / radPowerW;
        const efficiencyPct = (1 - ineff) * 100;
        let timeLabel = '';
        if (cooldownYears >= 100) {
            timeLabel = `${cooldownYears.toExponential(2)} years`;
        }
        else if (cooldownYears >= 1) {
            timeLabel = `${cooldownYears.toFixed(1)} years`;
        }
        else if (cooldownSec >= 86400) {
            timeLabel = `${(cooldownSec / 86400).toFixed(1)} days`;
        }
        else if (cooldownSec >= 3600) {
            timeLabel = `${(cooldownSec / 3600).toFixed(1)} hours`;
        }
        else {
            timeLabel = `${cooldownSec.toFixed(0)} seconds`;
        }
        return {
            ineff,
            efficiencyPct,
            wasteHeatJ,
            radPowerW,
            timeLabel,
            areaMultiple,
            viable: areaMultiple <= 1.0,
        };

// Companion artifact to the Typst-built PDF produced by ../typeset/build.sh
// =============================================================================
const TABS = [
    { id: 'command', label: 'Command', icon: Activity, code: '§00–01', group: 'Overview' },
    { id: 'structure', label: 'Structure', icon: Layers, code: '§02', group: 'Subsystems' },
    { id: 'construction', label: 'Construction', icon: Building2, code: '§02.5', group: 'Subsystems' },
    { id: 'reactor', label: 'Reactor', icon: Flame, code: '§03–04', group: 'Subsystems' },
    { id: 'drive', label: 'Drive & ECLSS', icon: Rocket, code: '§05–06', group: 'Subsystems' },
    { id: 'defense', label: 'Defense', icon: Shield, code: '§07–09', group: 'Subsystems' },
    { id: 'physics', label: 'Physics', icon: Atom, code: '§10–11', group: 'Verification & Delta' },
    { id: 'ds2', label: 'DS-2 Delta', icon: Hexagon, code: '§12 / A2', group: 'Verification & Delta' },
    { id: 'ledger', label: 'Ledger', icon: Binary, code: 'Appx B–F', group: 'Verification & Delta' },
];
const VALID_TAB_IDS = new Set(TABS.map(t => t.id));
function parseHash(hashStr) {
    const cleaned = hashStr.replace(/^#/, '').trim();
    if (!cleaned)
        return { tab: 'command', focusId: null };
    const [rawTab, rawFocus] = cleaned.split(':');
    const tab = VALID_TAB_IDS.has(rawTab) ? rawTab : 'command';
    return { tab, focusId: rawFocus ? decodeURIComponent(rawFocus) : null };
}
function App() {
    const initial = typeof window !== 'undefined' ? parseHash(window.location.hash) : { tab: 'command', focusId: null };
    const [tab, setTab] = useState(initial.tab);
    const [focusId, setFocusId] = useState(initial.focusId);
    const [glossaryOpen, setGlossaryOpen] = useState(false);
    const [firing, setFiring] = useState(0);
    const firingRaf = useRef(null);
    const tabRefs = useRef({});
    const navigate = useCallback((nextTab, nextFocus) => {
        setTab(nextTab);
        setFocusId(nextFocus ?? null);
        if (typeof window !== 'undefined') {
            const nextHash = nextFocus ? `#${nextTab}:${encodeURIComponent(nextFocus)}` : `#${nextTab}`;
            if (window.location.hash !== nextHash) {
                window.history.replaceState(null, '', nextHash);
            }
            if (!nextFocus) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
    }, []);
    useEffect(() => {
        const onHashChange = () => {
            const parsed = parseHash(window.location.hash);
            setTab(parsed.tab);
            setFocusId(parsed.focusId);
        };
        window.addEventListener('hashchange', onHashChange);
        return () => window.removeEventListener('hashchange', onHashChange);
    }, []);
    // Superlaser firing animation sequencer
    const startFire = useCallback(() => {
        if (firing > 0)
            return;
        if (typeof window !== 'undefined' && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) {
            setFiring(0.75);
            setTimeout(() => setFiring(0), 1200);
            return;
        }
        const start = performance.now();
        const step = (t) => {
            const dt = (t - start) / 1000;
            const f = Math.min(dt / 3.5, 1);
            setFiring(f);
            if (f < 1)
                firingRaf.current = requestAnimationFrame(step);
            else {
                setTimeout(() => setFiring(0), 800);
            }
        };
        firingRaf.current = requestAnimationFrame(step);
    }, [firing]);
    useEffect(() => () => {
        if (firingRaf.current !== null)
            cancelAnimationFrame(firingRaf.current);
    }, []);
    const handleTabKeyDown = (e, idx) => {
        let nextIdx = null;
        if (e.key === 'ArrowRight')
            nextIdx = (idx + 1) % TABS.length;
        else if (e.key === 'ArrowLeft')
            nextIdx = (idx - 1 + TABS.length) % TABS.length;
        else if (e.key === 'Home')
            nextIdx = 0;
        else if (e.key === 'End')
            nextIdx = TABS.length - 1;
        if (nextIdx !== null) {
            e.preventDefault();
            const targetTab = TABS[nextIdx];
            navigate(targetTab.id);
            tabRefs.current[targetTab.id]?.focus();
        }
    };
    return (<div className="min-h-screen" style={{ background: THEME.bg, color: THEME.text, fontFamily: "'JetBrains Mono', monospace" }}>
      {/* Top command bar */}
      <header style={{
            background: THEME.surface,
            borderBottom: `1px solid ${THEME.border}`,
            position: 'sticky',
            top: 0,
            zIndex: 40,
            backdropFilter: 'blur(6px)',
        }}>
        <div className="px-4 md:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3 max-w-[1800px] mx-auto">
          <div className="flex items-center gap-4">
            <div className="relative">
              <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
                <circle cx="18" cy="18" r="16" fill="none" stroke={THEME.amber} strokeWidth="1.5"/>
                <circle cx="12" cy="14" r="3" fill="none" stroke={THEME.amber} strokeWidth="1"/>
                <line x1="2" y1="18" x2="34" y2="18" stroke={THEME.amber} strokeWidth="0.6"/>
                <circle cx="18" cy="18" r="2" fill={THEME.amber}>
                  <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
                </circle>
              </svg>
            </div>
            <div>
              <h1 className="text-lg md:text-xl tracking-wider m-0" style={{ color: THEME.text, fontFamily: "'Chakra Petch', sans-serif", fontWeight: 600, letterSpacing: '0.08em' }}>
                DS-1 ORBITAL BATTLE STATION
              </h1>
              <div className="text-[11px] tracking-[0.22em] uppercase" style={{ color: THEME.amber, fontFamily: "'Chakra Petch', sans-serif" }}>
                Engineering Specification · Interactive Telemetry &amp; Traceability Console
              </div>
            </div>
          </div>

          <div className="flex items-center gap-3">
            <div className="hidden xl:flex items-center gap-4 text-xs mr-2" style={{ color: THEME.textMuted }}>
              <div className="flex items-center gap-1.5">
                <div style={{ width: 6, height: 6, background: THEME.green, animation: 'pulse 2s infinite' }}/>
                <span>LINK ACTIVE</span>
              </div>
              <div>SECTOR · HORUZ / DESPAYRE</div>

            <button type="button" onClick={() => setGlossaryOpen(true)} className="no-print inline-flex items-center gap-1.5 px-3 py-1.5 text-xs uppercase tracking-wider transition-colors" style={{
            background: THEME.panel,
            color: THEME.cyan,
            border: `1px solid ${THEME.cyan}60`,
            fontFamily: "'Chakra Petch', sans-serif",
            fontWeight: 600,
            cursor: 'pointer',
        }} title="Open Nomenclature & Verification Class Glossary (Appendix B & F)">
              <BookOpen size={13}/>
              <span>GLOSSARY · APPX B</span>
